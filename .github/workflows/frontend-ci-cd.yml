name: Frontend CI & CD (Vercel)

on:
  workflow_dispatch:   # manual trigger
  push:
    branches:
      - production
      - staging
      - development
    paths:
      - "my-frontend-app/**"  # only trigger if frontend files change
  pull_request:
    branches:
      - production
      - staging
      - development
    paths:
      - "my-frontend-app/**"  # only trigger if frontend files change

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my-frontend-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --watch=false --passWithNoTests

      - name: Build frontend
        run: CI=false npm run build

  frontend-cd:
    name: Frontend CD (Vercel)
    runs-on: ubuntu-latest
    needs: frontend-ci   # runs only after CI succeeds

    defaults:
      run:
        working-directory: my-frontend-app  # ensures only frontend folder is deployed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF##*/}"
          echo "Deploying frontend from branch: $BRANCH"

          # Skip deployment for development branch
          if [ "$BRANCH" = "development" ]; then
            echo "Skipping deployment for development branch."
            exit 0
          fi

          # Deploy production or staging
          if [ "$BRANCH" = "production" ]; then
            vercel --prod --confirm --token=$VERCEL_TOKEN
          else
            vercel --confirm --token=$VERCEL_TOKEN
          fi
