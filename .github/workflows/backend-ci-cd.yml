name: Backend CI & CD (Render)

on:
  workflow_dispatch:
  push:
    paths:
      - "my-backend-app/**"

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my-backend-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  backend-cd:
    name: Backend CD (Render)
    runs-on: ubuntu-latest
    needs: backend-ci

    steps:
      - name: Deploy backend to Render
        env:
          RENDER_PROD_HOOK: ${{ secrets.RENDER_PROD_HOOK }}
          RENDER_STAGING_HOOK: ${{ secrets.RENDER_STAGING_HOOK }}
          RENDER_DEV_HOOK: ${{ secrets.RENDER_DEV_HOOK }}
        run: |
          BRANCH="${GITHUB_REF##*/}"
          echo "Deploying backend from branch: $BRANCH"

          if [ "$BRANCH" = "production" ]; then
            curl -X POST "$RENDER_PROD_HOOK"

          elif [ "$BRANCH" = "staging" ]; then
            curl -X POST "$RENDER_STAGING_HOOK"

          elif [ "$BRANCH" = "development" ]; then
            curl -X POST "$RENDER_DEV_HOOK"

          else
            echo "No backend deployment configured for branch: $BRANCH"
            exit 1
          fi
